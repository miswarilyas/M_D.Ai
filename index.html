<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miswar's AI Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
            margin-bottom: 80px;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #cbd5e1; }
        
        /* AI Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #0284c7;
            padding: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-body {
            height: 200px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
        }
        .bot-msg { background: #334155; align-self: flex-start; }
        .user-msg { background: #0284c7; align-self: flex-end; }
        .chat-input {
            display: flex;
            border-top: 1px solid #334155;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            background: #0f172a;
            color: white;
            outline: none;
        }
        .chat-input button {
            background: #38bdf8;
            border: none;
            padding: 10px 15px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Malik Miswar</h1>
        <p>Web Developer & AI Enthusiast</p>
        <p>Niche AI Assistant se koi bhi sawal poocho!</p>
    </div>

    <div class="chat-widget">
        <div class="chat-header">🤖 Miswar's AI Assistant</div>
        <div class="chat-body" id="chatBody">
            <div class="msg bot-msg">Hello! Main Miswar ka AI Assistant hoon. Main aapki kya help kar sakta hoon?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Sawal poochein..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("userInput");
            let text = input.value.trim();
            if (text === "") return;

            let chatBody = document.getElementById("chatBody");

            // User Message
            let userDiv = document.createElement("div");
            userDiv.className = "msg user-msg";
            userDiv.innerText = text;
            chatBody.appendChild(userDiv);

            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            // AI Fast Response Logic
            setTimeout(() => {
                let botDiv = document.createElement("div");
                botDiv.className = "msg bot-msg";
                
                let lowerText = text.toLowerCase();
                if (lowerText.includes("kon") || lowerText.includes("who")) {
                    botDiv.innerText = "Malik Miswar ek Web Developer aur Creator hain!";
                } else if (lowerText.includes("contact") || lowerText.includes("rabta") || lowerText.includes("number")) {
                    botDiv.innerText = "Aap Miswar se unki website ya GitHub ke zariye rabta kar sakte hain.";
                } else if (lowerText.includes("hello") || lowerText.includes("hi") || lowerText.includes("oa")) {
                    botDiv.innerText = "Walaikum Assalam! Kese hain aap?";
                } else {
                    botDiv.innerText = "Shukriya aapke message ka! Main Miswar tak aapka paigham pohanchadoon ga.";
                }

                chatBody.appendChild(botDiv);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 500);
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>

</body>
</html>
