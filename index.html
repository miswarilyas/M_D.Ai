<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="GcTCxUjAgdM7zGlZBCGO9RsRFxV-db5bqoDvH-NA09s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&D.Ai - Professional Studio Edition</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%2310a37f' d='M379.8 268.7c24.9-19.3 24.9-56 0-75.3-33.7-26.1-98.3-71.8-123.8-89.4-4.2-2.9-9.9-2.9-14.1 0-25.5 17.6-90.1 63.3-123.8 89.4-24.9 19.3-24.9 56 0 75.3 33.7 26.1 98.3 71.8 123.8 89.4 4.2 2.9 9.9 2.9 14.1 0 25.5-17.6 90.1-63.3 123.8-89.4zM256 32l-192 128 192 192 192-192L256 32z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f11; color: #ececec; height: 100vh; display: flex; overflow: hidden; position: relative; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333338; border-radius: 10px; }
        
        .sidebar { width: 260px; background: #17171a; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid #27272a; z-index: 2; }
        .sidebar-top { display: flex; flex-direction: column; gap: 12px; }
        .new-chat-btn { background: #222226; border: 1px solid #3f3f46; color: #ffffff; padding: 11px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s ease; }
        .new-chat-btn:hover { background: #2d2d32; border-color: #10a37f; }
        .clear-all-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .clear-all-btn:hover { background: rgba(239, 68, 68, 0.1); }
        
        .user-profile-card { background: #222226; border: 1px solid #27272a; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #10a37f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
        .user-info h4 { font-size: 0.85rem; color: #ffffff; }
        .user-info p { font-size: 0.7rem; color: #10a37f; }
        .login-btn { background: #10a37f; color: #ffffff; border: none; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .login-btn:hover { background: #0d8a6c; }

        .main-chat { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: #0f0f11; z-index: 2; }
        .top-navbar { padding: 16px 28px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; background: #141417; }
        
        /* Animated Logo */
        .app-logo { font-size: 1.2rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 10px; }
        .animated-sparkle { color: #10a37f; animation: pulseGlow 2s infinite ease-in-out; }
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #10a37f); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 10px #10a37f); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px #10a37f); }
        }

        .chat-container { flex: 1; padding: 24px 22%; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .welcome-screen { text-align: center; margin-top: 18vh; }
        .welcome-screen h1 { font-size: 2.2rem; color: #ffffff; font-weight: 600; margin-bottom: 8px; }
        .welcome-screen p { color: #a1a1aa; font-size: 1rem; }

        .message-row { display: flex; gap: 14px; width: 100%; animation: fadeIn 0.3s ease; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .msg-bubble { max-width: 82%; padding: 14px 18px; border-radius: 18px; font-size: 0.96rem; line-height: 1.6; }
        .user .msg-bubble { background: #27272a; color: #ffffff; border-bottom-right-radius: 4px; border: 1px solid #3f3f46; }
        .bot .msg-bubble { background: #18181b; color: #ececec; border-bottom-left-radius: 4px; border: 1px solid #27272a; flex: 1; }

        .input-container-wrapper { padding: 18px 22% 28px; background: #141417; border-top: 1px solid #27272a; }
        .input-bar { background: #1f1f23; border: 1px solid #3f3f46; border-radius: 28px; display: flex; align-items: center; padding: 6px 16px; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .input-bar:focus-within { border-color: #10a37f; box-shadow: 0 0 12px rgba(16, 163, 127, 0.3); }
        .input-bar input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 0.98rem; padding: 8px; }
        
        .icon-btn { background: transparent; border: none; color: #a1a1aa; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1rem; }
        .icon-btn:hover { background: #27272a; color: #10a37f; }
        .mic-btn.listening { color: #ef4444; animation: micPulse 1s infinite; }
        @keyframes micPulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* Animated Avatar Icon */
        .ai-avatar-circle { width: 34px; height: 34px; border-radius: 50%; background: #10a37f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; flex-shrink: 0; box-shadow: 0 0 8px rgba(16, 163, 127, 0.4); animation: avatarGlow 3s infinite alternate; }
        @keyframes avatarGlow { 0% { box-shadow: 0 0 5px rgba(16, 163, 127, 0.3); } 100% { box-shadow: 0 0 15px rgba(16, 163, 127, 0.8); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <button class="clear-all-btn" onclick="clearAllChatHistory()">
                <i class="fa-solid fa-trash-can"></i> Clear History
            </button>
        </div>

        <div class="user-profile-card">
            <div class="user-profile">
                <div class="user-avatar" id="avatarText">MM</div>
                <div class="user-info">
                    <h4 id="userName">Malik Miswar</h4>
                    <p id="userStatus">● VIP Active</p>
                </div>
            </div>
            <button class="login-btn" onclick="handleAccountLogin()">
                <i class="fa-solid fa-user-pen"></i> Change Profile Name
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="top-navbar">
            <div class="app-logo">
                <i class="fa-solid fa-wand-magic-sparkles animated-sparkle"></i>
                <span>M&D.Ai <small style="font-size: 0.65rem; color: #10a37f; margin-left: 4px;">PRO</small></span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>What can I help with today?</h1>
                <p>Ask questions or chat effortlessly in English or Roman Urdu ✨</p>
            </div>
        </div>

        <div id="aiLoadingRow" class="hidden message-row bot">
            <div class="ai-avatar-circle">M&D</div>
            <div class="msg-bubble" style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-notch fa-spin" style="color: #10a37f;"></i> Thinking...
            </div>
        </div>

        <div class="input-container-wrapper">
            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Message M&D.Ai..." onkeypress="handleKeyPress(event)">
                
                <button class="icon-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send Message">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        
        const SYSTEM_PROMPT = `
You are 'M&D.Ai', an advanced professional AI created by Malik Miswar.

RULES:
1. IF USER SAYS SIMPLE ENGLISH GREETING (e.g. "Hi", "Hello"):
   - Reply in English: "Hello! How can I help you today? 😊"

2. IF USER WRITES IN ROMAN URDU (e.g. "kya haal hai", "kaise ho"):
   - Reply ONLY in Roman Urdu.

3. NO MIXING & NO BRACKET TRANSLATIONS.
`;
        let conversationHistory = [];

        function handleAccountLogin() {
            const name = prompt("Enter Name:", "Malik Miswar");
            if (name && name.trim()) {
                document.getElementById('userName').innerText = name.trim();
                document.getElementById('avatarText').innerText = name.trim().substring(0, 2).toUpperCase();
            }
        }

        function startNewChat() {
            localStorage.removeItem('md_ai_chat_history');
            conversationHistory = [];
            location.reload();
        }

        function clearAllChatHistory() { if (confirm("Delete all history?")) startNewChat(); }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Speech Recognition not supported in this browser.");
            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');
            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function callGroqAPI(userText) {
            try {
                let messagesPayload = [{ role: "system", content: SYSTEM_PROMPT }];
                const recentHistory = conversationHistory.slice(-6);
                for (let h of recentHistory) {
                    messagesPayload.push({
                        role: h.role === 'user' ? 'user' : 'assistant',
                        content: h.text
                    });
                }
                messagesPayload.push({ role: "user", content: userText });

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messagesPayload
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]?.message?.content) {
                    return data.choices[0].message.content.trim();
                }
                return "Jawab nahi mil sakaa.";
            } catch (err) {
                return "Network Error!";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingRow = document.getElementById('aiLoadingRow');
            const text = input.value.trim();

            if (!text) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatContainer.appendChild(userRow);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatContainer.appendChild(aiLoadingRow);
            aiLoadingRow.classList.remove('hidden');

            const rawReply = await callGroqAPI(text);

            conversationHistory.push({ role: 'user', text: text });
            conversationHistory.push({ role: 'assistant', text: rawReply });

            aiLoadingRow.classList.add('hidden');
            document.body.appendChild(aiLoadingRow);

            const botRow = document.createElement('div');
            botRow.className = 'message-row bot';
            botRow.innerHTML = `<div class="ai-avatar-circle">M&D</div><div class="msg-bubble">${marked.parse(rawReply)}</div>`;
            chatContainer.appendChild(botRow);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
