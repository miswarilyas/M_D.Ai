<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="GcTCxUjAgdM7zGlZBCGO9RsRFxV-db5bqoDvH-NA09s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&D.Ai - VIP AI Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #000; color: #fff; height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background: #0c0c0f; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #27272a; }
        .main-chat { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .top-navbar { padding: 18px 28px; border-bottom: 1px solid #27272a; font-weight: bold; color: #ffd700; font-size: 1.2rem; }
        .chat-container { flex: 1; padding: 24px 20%; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .welcome-screen { text-align: center; margin-top: 15vh; }
        .welcome-screen h1 { font-size: 2.5rem; }
        .welcome-screen h1 span { color: #ffd700; }
        .message-row { display: flex; gap: 12px; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .msg-bubble { max-width: 80%; padding: 12px 18px; border-radius: 16px; line-height: 1.5; }
        .user .msg-bubble { background: #27272a; color: #fff; }
        .bot .msg-bubble { background: transparent; color: #e4e4e7; }
        .msg-bubble img { max-width: 250px; border-radius: 8px; margin-top: 8px; }
        .input-container-wrapper { padding: 20px 20%; background: #000; }
        .input-bar { background: #18181b; border: 1px solid #27272a; border-radius: 30px; display: flex; align-items: center; padding: 6px 16px; gap: 10px; }
        .input-bar input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; padding: 8px; }
        .icon-btn { background: transparent; border: none; color: #ffd700; cursor: pointer; font-size: 1.1rem; padding: 6px; }
        .preview-box { display: none; margin-bottom: 8px; position: relative; width: fit-content; }
        .preview-box img { max-width: 100px; border-radius: 8px; border: 1px solid #ffd700; }
        .ai-avatar-circle { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        .hidden { display: none !important; }
        .new-chat-btn { background: #18181b; border: 1px solid #ffd700; color: #ffd700; padding: 10px; border-radius: 20px; cursor: pointer; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div>
            <button class="new-chat-btn" onclick="location.reload()"><i class="fa-solid fa-plus"></i> New VIP Chat</button>
        </div>
        <div style="color: #a1a1aa; font-size: 0.85rem;">M&D.Ai VIP Studio</div>
    </div>

    <div class="main-chat">
        <div class="top-navbar"><i class="fa-solid fa-gem"></i> M&D.Ai VIP</div>
        
        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Hello, <span>Malik Miswar</span></h1>
                <p>How can I assist you today?</p>
            </div>
        </div>

        <div id="aiLoadingRow" class="hidden message-row bot">
            <div class="ai-avatar-circle">M&D</div>
            <div class="msg-bubble">Thinking...</div>
        </div>

        <div class="input-container-wrapper">
            <div class="preview-box" id="previewBox">
                <img id="imgPreview" src="">
                <button onclick="removeImage()" style="position:absolute; top:-5px; right:-5px; background:red; color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;">×</button>
            </div>

            <div class="input-bar">
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()"><i class="fa-solid fa-plus"></i></button>
                <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
                <input type="text" id="userInput" placeholder="Ask M&D.Ai..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="icon-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "gsk_" + "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";
        let selectedBase64Image = "";

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedBase64Image = event.target.result;
                    document.getElementById('imgPreview').src = selectedBase64Image;
                    document.getElementById('previewBox').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedBase64Image = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('previewBox').style.display = 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingRow = document.getElementById('aiLoadingRow');
            const text = input.value.trim();

            if (!text && !selectedBase64Image) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            let userHtml = `<div class="msg-bubble">${text || "Analyzing Image..."}`;
            if (selectedBase64Image) {
                userHtml += `<br><img src="${selectedBase64Image}">`;
            }
            userHtml += `</div>`;
            userRow.innerHTML = userHtml;
            chatContainer.appendChild(userRow);

            input.value = '';
            const currentImg = selectedBase64Image;
            removeImage();

            chatContainer.scrollTop = chatContainer.scrollHeight;
            aiLoadingRow.classList.remove('hidden');

            try {
                let rawReply = "";

                if (currentImg) {
                    const promptText = text || "Describe this image in detail in Roman Urdu.";
                    const response = await fetch("https://text.pollinations.ai/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: [
                                {
                                    role: "user",
                                    content: [
                                        { type: "text", text: promptText },
                                        { type: "image_url", image_url: { url: currentImg } }
                                    ]
                                }
                            ],
                            model: "openai"
                        })
                    });
                    rawReply = await response.text();
                } else {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + GROQ_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [{ role: "user", content: text }],
                            temperature: 0.7
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    rawReply = data.choices[0].message.content;
                }

                aiLoadingRow.classList.add('hidden');

                const botRow = document.createElement('div');
                botRow.className = 'message-row bot';
                botRow.innerHTML = `
                    <div class="ai-avatar-circle">M&D</div>
                    <div class="msg-bubble">${marked.parse(rawReply)}</div>
                `;
                chatContainer.appendChild(botRow);

            } catch (err) {
                console.error(err);
                aiLoadingRow.classList.add('hidden');
                
                const errorRow = document.createElement('div');
                errorRow.className = 'message-row bot';
                errorRow.innerHTML = `
                    <div class="ai-avatar-circle">M&D</div>
                    <div class="msg-bubble">Sorry, could not process request. Try again.</div>
                `;
                chatContainer.appendChild(errorRow);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
