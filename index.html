<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Miswar | Gemini AI Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 280px;
            background: #1e1f20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid #2d2f31;
            transition: all 0.3s ease;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .new-chat-btn {
            background: #282a2c;
            border: 1px solid #3c4043;
            color: #e3e3e3;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .new-chat-btn:hover { background: #37393b; }

        .recent-section h5 {
            color: #8e918f;
            font-size: 0.8rem;
            margin: 15px 0 10px 10px;
            text-transform: uppercase;
        }

        .recent-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .recent-item {
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #c4c7c5;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-item:hover { background: #282a2c; color: #fff; }

        /* USER ACCOUNT PROFILE WITH LOGIN BUTTON */
        .user-profile-card {
            background: #282a2c;
            border: 1px solid #3c4043;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }
        .user-info { flex: 1; overflow: hidden; }
        .user-info h4 { font-size: 0.85rem; color: #e3e3e3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info p { font-size: 0.72rem; color: #4ade80; }

        .login-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .login-btn:hover { background: #0284c7; color: #fff; }

        /* RIGHT MAIN CHAT AREA */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: #131314;
        }

        /* HEADER */
        .top-navbar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e3e3e3;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-logo i { color: #38bdf8; }

        /* MESSAGES AREA */
        .chat-container {
            flex: 1;
            padding: 20px 15%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-screen {
            text-align: center;
            margin-top: 10vh;
        }
        .welcome-screen h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .welcome-screen p { color: #8e918f; font-size: 1.1rem; }

        .message-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .message-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .user .msg-bubble {
            background: #282a2c;
            color: #e3e3e3;
            border-bottom-right-radius: 4px;
        }
        .bot .msg-bubble {
            background: transparent;
            color: #e3e3e3;
            padding-left: 0;
        }

        /* FLOATING INPUT BAR AT BOTTOM */
        .input-container-wrapper {
            padding: 20px 15% 30px;
        }
        .input-bar {
            background: #1e1f20;
            border: 1px solid #3c4043;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 10px;
        }
        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            padding: 8px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .icon-btn:hover { background: #282a2c; color: #fff; }
        .mic-btn.listening { color: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New chat
            </button>
            <div class="recent-section">
                <h5>Recent</h5>
                <ul class="recent-list" id="recentList">
                    <li class="recent-item"><i class="fa-regular fa-message"></i> Portfolio Help</li>
                    <li class="recent-item"><i class="fa-regular fa-message"></i> Web Development</li>
                </ul>
            </div>
        </div>

        <div class="user-profile-card">
            <div class="user-profile">
                <div class="user-avatar" id="avatarText">MM</div>
                <div class="user-info">
                    <h4 id="userName">Malik Miswar</h4>
                    <p id="userStatus">● Logged In</p>
                </div>
            </div>
            <button class="login-btn" onclick="handleAccountLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Login / Switch Account
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="top-navbar">
            <div class="app-logo">
                <i class="fa-solid fa-sparkles"></i> Miswar AI
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 id="welcomeTitle">Hello, Malik Miswar</h1>
                <p>How can I help you today?</p>
            </div>
        </div>

        <div class="input-container-wrapper">
            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Ask Miswars..." onkeypress="handleKeyPress(event)">
                <button class="icon-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "gsk_" + "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";

        function handleAccountLogin() {
            const name = prompt("Enter your Name to Login:", "Malik Miswar");
            if (name && name.trim() !== "") {
                const cleanName = name.trim();
                document.getElementById('userName').innerText = cleanName;
                document.getElementById('avatarText').innerText = cleanName.substring(0, 2).toUpperCase();
                
                const welcomeTitle = document.getElementById('welcomeTitle');
                if (welcomeTitle) {
                    welcomeTitle.innerText = `Hello, ${cleanName}`;
                }
                alert(`Welcome ${cleanName}! Account updated successfully.`);
            }
        }

        function startNewChat() {
            const currentName = document.getElementById('userName').innerText;
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1 id="welcomeTitle">Hello, ${currentName}</h1>
                    <p>How can I help you today?</p>
                </div>`;
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Please use Chrome browser for voice input.");

            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');

            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const text = input.value.trim();

            if (!text) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            // Append User Message
            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatContainer.appendChild(userRow);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Bot Message Placeholder
            const botRow = document.createElement('div');
            botRow.className = 'message-row bot';
            botRow.innerHTML = `<div class="msg-bubble">Thinking... 🧠</div>`;
            chatContainer.appendChild(botRow);

            // Add to recent list sidebar
            const recentList = document.getElementById('recentList');
            const newRecent = document.createElement('li');
            newRecent.className = 'recent-item';
            newRecent.innerHTML = `<i class="fa-regular fa-message"></i> ${text.substring(0, 18)}...`;
            recentList.prepend(newRecent);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + GROQ_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are a helpful AI assistant for Malik Miswar's app." },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await response.json();
                botRow.querySelector('.msg-bubble').innerText = data.choices[0].message.content;
            } catch (err) {
                botRow.querySelector('.msg-bubble').innerText = "Network Error. Please try again.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
