                </div>

            </button>

    <div class="main-chat">
        <div class="top-navbar">
            <div class="app-logo">
                <i class="fa-solid fa-gem" style="color: #ffd700;"></i>
                <span class="logo-text">M&D.Ai <small style="color: #ffd700; font-size: 0.6rem; font-weight: 600;">VIP</small></span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 id="welcomeTitle">Hello, <span>Malik Miswar</span></h1>
                <p>Welcome to your premium M&D.Ai VIP Studio. How can I assist you today?</p>
            </div>
        </div>

        <div id="aiLoadingRow" class="hidden message-row bot">
            <div class="ai-avatar-circle thinking">M&D</div>
        </div>

        <div class="input-container-wrapper">
            <div class="preview-box" id="previewBox">
                <img id="imgPreview" src="" alt="Selected Image">
                <button class="remove-img-btn" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="input-bar">
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Attach Image">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

                <input type="text" id="userInput" placeholder="Ask M&D.Ai VIP or attach an image..." onkeypress="handleKeyPress(event)">
                
                <button class="icon-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send Premium">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "gsk_" + "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";
        let selectedBase64Image = "";

        const SYSTEM_PROMPT = `You are 'M&D.Ai VIP', created by Malik Miswar.
Act like ChatGPT:
- Match the response length to the user's query naturally.
- If the user asks a simple question or engages in casual talk, give a direct, natural response.
- If the user asks for detailed explanations, topics, code, or history, give a nicely structured answer with markdown headings and points.
- Always match the user's language (Roman Urdu, Urdu, or English).`;

        let conversationHistory = [];

        function resetSystemPrompt() {
            conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
        }

        window.onload = function() {
            const savedHistory = localStorage.getItem('md_ai_chat_history');
            const savedTitles = localStorage.getItem('md_ai_recent_titles');
            
            if (savedHistory) {
                try {
                    const parsed = JSON.parse(savedHistory);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        conversationHistory = parsed;
                        conversationHistory[0] = { role: "system", content: SYSTEM_PROMPT };
                    }
                    
                    const chatContainer = document.getElementById('chatContainer');
                    const welcome = document.getElementById('welcomeScreen');
                    if (welcome) welcome.remove();

                    for (let i = 1; i < conversationHistory.length; i++) {
                        const msg = conversationHistory[i];
                        const row = document.createElement('div');
                        if (msg.role === 'user') {
                            row.className = 'message-row user';
                            let textHtml = typeof msg.content === 'string' ? msg.content : '';
                            row.innerHTML = `<div class="msg-bubble">${textHtml}</div>`;
                        } else {
                            row.className = 'message-row bot';
                            row.innerHTML = `
                                <div class="ai-avatar-circle">M&D</div>
                                <div class="msg-bubble">${marked.parse(msg.content)}</div>
                            `;
                        }
                        chatContainer.appendChild(row);
                    }
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch(e) { console.log(e); }
            } else {
                resetSystemPrompt();
            }

            if (savedTitles) {
                document.getElementById('recentList').innerHTML = savedTitles;
            }
        };

        function saveToLocalStorage() {
            localStorage.setItem('md_ai_chat_history', JSON.stringify(conversationHistory));
            localStorage.setItem('md_ai_recent_titles', document.getElementById('recentList').innerHTML);
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedBase64Image = event.target.result;
                    document.getElementById('imgPreview').src = selectedBase64Image;
                    document.getElementById('previewBox').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedBase64Image = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('previewBox').style.display = 'none';
        }

        function handleAccountLogin() {
            const name = prompt("Enter your Name for VIP Access:", "Malik Miswar");
            if (name && name.trim() !== "") {
                const cleanName = name.trim();
                document.getElementById('userName').innerText = cleanName;
                document.getElementById('avatarText').innerText = cleanName.substring(0, 2).toUpperCase();
                const welcomeTitleSpan = document.querySelector('#welcomeTitle span');
                if (welcomeTitleSpan) welcomeTitleSpan.innerText = cleanName;
            }
        }

        function startNewChat() {
            const currentName = document.getElementById('userName').innerText;
            resetSystemPrompt();
            localStorage.removeItem('md_ai_chat_history');
            localStorage.removeItem('md_ai_recent_titles');
            document.getElementById('recentList').innerHTML = '';
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1 id="welcomeTitle">Hello, <span>${currentName}</span></h1>
                    <p>Welcome to your premium M&D.Ai VIP Studio. How can I assist you today?</p>
                </div>`;
            removeImage();
        }

        function clearAllChatHistory() {
            if (confirm("Are you sure you want to delete all chat history?")) {
                startNewChat();
            }
        }

        function deleteSpecificChat(buttonElement) {
            event.stopPropagation();
            const listItem = buttonElement.closest('li');
            if (listItem) {
                listItem.remove();
                saveToLocalStorage();
            }
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Please use Chrome browser for voice input.");

            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');

            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingRow = document.getElementById('aiLoadingRow');
            const text = input.value.trim();

            if (!text && !selectedBase64Image) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            let userHtml = `<div class="msg-bubble">${text || "Analyzing Attached Image..."}`;
            if (selectedBase64Image) {
                userHtml += `<br><img src="${selectedBase64Image}">`;
            }
            userHtml += `</div>`;
            userRow.innerHTML = userHtml;
            chatContainer.appendChild(userRow);

            input.value = '';
            const currentImg = selectedBase64Image;
            removeImage();

            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (conversationHistory.filter(m => m.role === 'user').length === 0 || currentImg) {
                const recentList = document.getElementById('recentList');
                const newRecent = document.createElement('li');
                newRecent.className = 'recent-item';
                const labelText = text || "Image Analysis";
                newRecent.innerHTML = `
                    <div class="recent-text"><i class="fa-solid fa-gem" style="color: #ffd700; font-size: 0.7rem;"></i> ${labelText.substring(0, 16)}...</div>
                    <button class="chat-menu-btn" onclick="deleteSpecificChat(this)" title="Delete Chat"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                `;
                recentList.prepend(newRecent);
            }

            chatContainer.appendChild(aiLoadingRow);
            aiLoadingRow.classList.remove('hidden');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let rawReply = "";

                if (currentImg) {
                    // Extract text via client-side OCR for guaranteed error-free response
                    const ocrResult = await Tesseract.recognize(currentImg, 'eng');
                    const extractedText = ocrResult.data.text.trim();

                    let promptQuery = text ? `${text}\n\n[Extracted Text from Image]: ${extractedText}` : `Explain and solve this image/screenshot content:\n${extractedText}`;
                    
                    if (!extractedText && !text) {
                        promptQuery = "User uploaded an image. Provide a general friendly response asking how you can help them with this file.";
                    }

                    conversationHistory.push({ role: "user", content: promptQuery });

                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + GROQ_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: conversationHistory,
                            temperature: 0.7,
                            max_tokens: 1024
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    rawReply = data.choices[0].message.content;
                    conversationHistory.push({ role: "assistant", content: rawReply });

                } else {
                    if (conversationHistory.length === 0) resetSystemPrompt();
                    conversationHistory.push({ role: "user", content: text });

                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + GROQ_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: conversationHistory,
                            temperature: 0.7,
                            max_tokens: 1024
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    rawReply = data.choices[0].message.content;
                    conversationHistory.push({ role: "assistant", content: rawReply });
                }

                aiLoadingRow.classList.add('hidden');
                document.body.appendChild(aiLoadingRow);

                const botRow = document.createElement('div');
                botRow.className = 'message-row bot';
                botRow.innerHTML = `
                    <div class="ai-avatar-circle">M&D</div>
                    <div class="msg-bubble">${marked.parse(rawReply)}</div>
                `;
                chatContainer.appendChild(botRow);

                saveToLocalStorage();

            } catch (err) {
                console.error(err);
                aiLoadingRow.classList.add('hidden');
                document.body.appendChild(aiLoadingRow);
                
                const errorRow = document.createElement('div');
                errorRow.className = 'message-row bot';
                errorRow.innerHTML = `
                    <div class="ai-avatar-circle">M&D</div>
                    <div class="msg-bubble">Something went wrong. Please try again! Error: ${err.message || 'Unknown Error'}</div>
                `;
                chatContainer.appendChild(errorRow);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
