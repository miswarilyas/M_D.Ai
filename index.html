<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&D.Ai Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* BLACK & WHITE MODERN THEME */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 280px;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border-right: 1px solid #222222;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .new-chat-btn {
            background: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover { background: #2a2a2a; border-color: #555; }

        .recent-section h5 {
            color: #888888;
            font-size: 0.78rem;
            margin: 18px 0 10px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 52vh;
            overflow-y: auto;
        }

        .recent-item {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            color: #cccccc;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .recent-item:hover { background: #1a1a1a; color: #ffffff; }

        /* USER ACCOUNT CARD AT BOTTOM */
        .user-profile-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .user-info { flex: 1; overflow: hidden; }
        .user-info h4 { font-size: 0.88rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info p { font-size: 0.72rem; color: #a3a3a3; }

        .login-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .login-btn:hover { background: #e5e5e5; }

        /* RIGHT MAIN CHAT AREA */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000000;
        }

        .top-navbar {
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #111111;
        }
        .app-logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-logo i { color: #ffffff; }

        .chat-container {
            flex: 1;
            padding: 20px 18%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .welcome-screen {
            text-align: center;
            margin-top: 12vh;
        }
        .welcome-screen h1 {
            font-size: 2.8rem;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .welcome-screen p { color: #888888; font-size: 1.15rem; }

        .message-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .message-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.6;
        }
        .user .msg-bubble {
            background: #1f1f1f;
            color: #ffffff;
            border: 1px solid #333;
            border-bottom-right-radius: 4px;
        }
        .bot .msg-bubble {
            background: transparent;
            color: #e5e5e5;
            padding-left: 0;
            width: 100%;
        }

        /* Markdown Styles for Answers */
        .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 14px 0 8px; color: #ffffff; }
        .msg-bubble p { margin-bottom: 10px; }
        .msg-bubble ul, .msg-bubble ol { margin: 10px 0 10px 20px; }
        .msg-bubble li { margin-bottom: 6px; }
        .msg-bubble pre {
            background: #111111;
            padding: 14px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid #222222;
            margin: 12px 0;
        }
        .msg-bubble code { font-family: monospace; color: #ffffff; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; }

        /* FLOATING INPUT BAR */
        .input-container-wrapper { padding: 20px 18% 30px; }
        .input-bar {
            background: #0f0f0f;
            border: 1px solid #262626;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 18px;
            gap: 10px;
        }
        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.98rem;
            padding: 8px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #888888;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .icon-btn:hover { background: #222222; color: #ffffff; }
        .mic-btn.listening { color: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* NEW CHAT LOADING ANIMATION (PREMIUM LOGO EFFECT) */
        .ai-message-placeholder {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .ai-logo-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: #ffffff;
            position: relative;
            background: #000000;
        }

        .loading-lines {
            display: flex;
            gap: 3px;
        }

        .loading-lines span {
            width: 3px;
            height: 10px;
            background: #ffffff;
            border-radius: 2px;
            animation: line-grow 1s infinite ease-in-out;
        }

        .loading-lines span:nth-child(2) { animation-delay: 0.2s; }
        .loading-lines span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes line-grow {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(2); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New chat
            </button>
            <div class="recent-section">
                <h5>Recent Chats</h5>
                <ul class="recent-list" id="recentList"></ul>
            </div>
        </div>

        <div class="user-profile-card">
            <div class="user-profile">
                <div class="user-avatar" id="avatarText">MM</div>
                <div class="user-info">
                    <h4 id="userName">Malik Miswar</h4>
                    <p id="userStatus">● Active</p>
                </div>
            </div>
            <button class="login-btn" onclick="handleAccountLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Switch Account
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="top-navbar">
            <div class="app-logo">
                <i class="fa-solid fa-sparkles"></i> M&D.Ai
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 id="welcomeTitle">Hello, Malik Miswar</h1>
                <p>How can I help you today?</p>
            </div>
        </div>

        <div id="aiLoadingMessage" class="hidden message-row bot">
            <div class="ai-message-placeholder">
                <div class="ai-logo-circle">M&D</div>
                <div class="loading-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="input-container-wrapper">
            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Ask M&D.Ai..." onkeypress="handleKeyPress(event)">
                <button class="icon-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "gsk_" + "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";

        // FRIENDLY & INTELLIGENT CHAT MEMORY
        let conversationHistory = [
            { 
                role: "system", 
                content: `You are 'M&D.Ai', a friendly, natural, and highly smart AI assistant (like Gemini). 

IMPORTANT RULES FOR RESPONDING:
1. FOR CASUAL CHAT / GREETINGS (e.g. "kya haal hai", "hi", "kaise ho", "kya kar rahe ho"): 
   - Respond like a natural human friend in a short, warm, 1 or 2 line sentence.
   - ALWAYS include exactly 1 relevant emoji (e.g. 😊, 👍, 🌟).
   - Do NOT give long lectures, system bios, or complex details for normal greetings!

2. FOR INFORMATIVE / TECHNICAL / DETAILED QUESTIONS (e.g. coding, concepts, explanations, advice):
   - Provide a deep, clear, well-structured, Gemini-style answer with Markdown headings, bullet points, and code blocks.

3. Always reply in the same language as the user (Urdu, Roman Urdu, English, etc.).` 
            }
        ];

        function handleAccountLogin() {
            const name = prompt("Enter your Name:", "Malik Miswar");
            if (name && name.trim() !== "") {
                const cleanName = name.trim();
                document.getElementById('userName').innerText = cleanName;
                document.getElementById('avatarText').innerText = cleanName.substring(0, 2).toUpperCase();
                
                const welcomeTitle = document.getElementById('welcomeTitle');
                if (welcomeTitle) welcomeTitle.innerText = `Hello, ${cleanName}`;
            }
        }

        function startNewChat() {
            const currentName = document.getElementById('userName').innerText;
            conversationHistory = [conversationHistory[0]];
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1 id="welcomeTitle">Hello, ${currentName}</h1>
                    <p>How can I help you today?</p>
                </div>`;
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Please use Chrome browser for voice input.");

            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');

            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingMsg = document.getElementById('aiLoadingMessage');
            const text = input.value.trim();

            if (!text) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            // Append User Message
            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatContainer.appendChild(userRow);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            conversationHistory.push({ role: "user", content: text });

            // Add to Recent List on First Message
            if (conversationHistory.length === 2) {
                const recentList = document.getElementById('recentList');
                const newRecent = document.createElement('li');
                newRecent.className = 'recent-item';
                newRecent.innerHTML = `<i class="fa-regular fa-message"></i> ${text.substring(0, 18)}...`;
                recentList.prepend(newRecent);
            }

            // SHOW AI LOADING LOGO (CIRCLE & LINE EFFECT)
            chatContainer.appendChild(aiLoadingMsg);
            aiLoadingMsg.classList.remove('hidden');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + GROQ_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const rawReply = data.choices[0].message.content;
                
                conversationHistory.push({ role: "assistant", content: rawReply });

                // HIDE AI LOADING MESSAGE
                aiLoadingMsg.classList.add('hidden');
                document.body.appendChild(aiLoadingMsg); // Move back outside chat container

                // Append Real AI Response (M&D.Ai Circle Logo shown once per response start)
                const botRow = document.createElement('div');
                botRow.className = 'message-row bot';
                
                // M&D Logo integrated before Markdown reply start
                botRow.innerHTML = `<div class="ai-logo-circle">M&D</div><div class="msg-bubble">${marked.parse(rawReply)}</div>`;
                chatContainer.appendChild(botRow);

            } catch (err) {
                aiLoadingMsg.classList.add('hidden');
                document.body.appendChild(aiLoadingMsg);
                alert("Network Error. Please try again.");
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
