<body>

                    </button>

    </div>

    <script>
        const GROQ_API_KEY = "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";
        let attachedImageBase64 = null;

        if (window.marked) marked.setOptions({ breaks: true });

        const surahMap = {
            "fatiha": 1, "baqarah": 2, "imran": 3, "nisa": 4, "maidah": 5, "anam": 6, "araf": 7, "anfal": 8, "taubah": 9, "yunus": 10,
            "hud": 11, "yusuf": 12, "rad": 13, "ibrahim": 14, "hijr": 15, "nahl": 16, "isra": 17, "kahf": 18, "maryam": 19, "taha": 20,
            "yanbiya": 21, "hajj": 22, "muminun": 23, "nur": 24, "furqan": 25, "shuara": 26, "naml": 27, "qasas": 28, "ankabut": 29,
            "rum": 30, "luqman": 31, "sajdah": 32, "ahzab": 33, "saba": 34, "fatir": 35, "yaseen": 36, "yasin": 36, "saffat": 37,
            "sad": 38, "zumar": 39, "ghafir": 40, "fussilat": 41, "shura": 42, "zukhruf": 43, "dukhan": 44, "jathiyah": 45, "ahqaf": 46,
            "muhammad": 47, "fath": 48, "hujurat": 49, "qaf": 50, "dhariyat": 51, "tur": 52, "najm": 53, "qamar": 54, "rahman": 55,
            "rehman": 55, "waqiah": 56, "hadid": 57, "mujadila": 58, "hashr": 59, "mumtahanah": 60, "saff": 61, "jumuah": 62,
            "munafiqun": 63, "taghabun": 64, "talaq": 65, "tahrim": 66, "mulk": 67, "qalam": 68, "haqqah": 69, "maarij": 70, "nuh": 71,
            "jinn": 72, "muzzammil": 73, "muddathir": 74, "qiyamah": 75, "insan": 76, "mursalat": 77, "naba": 78, "naziat": 79,
            "abasa": 80, "takwir": 81, "infitar": 82, "mutaffifin": 83, "inshiqaq": 84, "buruj": 85, "tariq": 86, "ala": 87, "ghashiyah": 88,
            "fajr": 89, "balad": 90, "shams": 91, "layl": 92, "duha": 93, "sharh": 94, "tin": 95, "alaq": 96, "qadr": 97, "bayyinah": 98,
            "zilzal": 99, "adiyat": 100, "qariah": 101, "takathur": 102, "asr": 103, "humazah": 104, "fil": 105, "quraish": 106,
            "maun": 107, "kawthar": 108, "kafirun": 109, "nasr": 110, "masad": 111, "ikhlas": 112, "falaq": 113, "nas": 114
        };

        const SYSTEM_PROMPT = `
You are 'M&D.Ai', built by Malik Miswar. You are a helpful AI assistant.

IMPORTANT RULES:
1. GREETINGS ("Hello", "Hi", "Hey", "Assalam o Alaikum"): Reply SHORT & NATURAL like "Hello! How can I help you today? 😊".
2. SVG ICONS: When user requests an SVG icon, format it nicely with live strokes fill="none" stroke="#1f1f1f" stroke-width="2".
3. QURANIC QUESTIONS: For Tafseer or Tarjuma, provide authentic, beautifully formatted responses.
4. Match user language (English, Roman Urdu, Urdu).
`;

        let conversationHistory = [];

        function handleAccountLogin() {
            const name = prompt("Enter Name:", "Malik Miswar");
            if (name && name.trim()) {
                document.getElementById('userName').innerText = name.trim();
                document.getElementById('avatarText').innerText = name.trim().substring(0, 2).toUpperCase();
            }
        }

        function startNewChat() {
            conversationHistory = [];
            location.reload();
        }

        function clearAllChatHistory() { if (confirm("Delete all history?")) startNewChat(); }

        /* Image Attachment Functions */
        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    attachedImageBase64 = evt.target.result;
                    document.getElementById('imagePreview').src = attachedImageBase64;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeAttachedImage() {
            attachedImageBase64 = null;
            document.getElementById('imageFileInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        /* Improved High Quality Vector Edge Tracing Engine */
        async function convertImageToLiveStrokeSVG(imageSrc) {
            return new Promise((resolve) => {
                if (typeof Potrace !== "undefined") {
                    Potrace.loadImageFromUrl(imageSrc, function() {
                        Potrace.setParameter({
                            turnpolicy: "minority",
                            tordist: 1.0,
                            optcurve: true,
                            alphamax: 1,
                            opttolerance: 0.2
                        });
                        Potrace.process(function() {
                            let svgStr = Potrace.getSVG(1);
                            if (svgStr) {
                                // Convert output paths into Live Unexpanded Stroke style
                                svgStr = svgStr.replace(/fill="[^"]*"/g, 'fill="none"')
                                               .replace(/<path/g, '<path stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"');
                                resolve(svgStr);
                            } else {
                                resolve(null);
                            }
                        });
                    });
                } else {
                    resolve(null);
                }
            });
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Speech Recognition not supported in browser.");
            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');
            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function fetchQuranSurah(surahNum) {
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
                const data = await res.json();
                if (data.code === 200) {
                    const surah = data.data;
                    let arabicHtml = `<div class="quran-box">`;
                    arabicHtml += `<div class="quran-header">📖 سورة ${surah.name} (${surah.englishName})</div>`;
                    arabicHtml += `<div class="quran-arabic">`;
                    
                    surah.ayahs.forEach(ayah => {
                        arabicHtml += `${ayah.text} <span class="verse-num">۝${ayah.numberInSurah}</span> `;
                    });
                    
                    arabicHtml += `</div></div>`;
                    return { success: true, html: arabicHtml };
                }
            } catch (e) {
                console.error(e);
            }
            return { success: false };
        }

        async function callGroqAPI(userText) {
            try {
                let messagesPayload = [{ role: "system", content: SYSTEM_PROMPT }];
                const recentHistory = conversationHistory.slice(-6);
                for (let h of recentHistory) {
                    messagesPayload.push({ role: h.role === 'user' ? 'user' : 'assistant', content: h.text });
                }
                messagesPayload.push({ role: "user", content: userText });

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messagesPayload,
                        temperature: 0.5
                    })
                });

                const data = await response.json();
                return data.choices?.[0]?.message?.content?.trim() || "Aapke sawal ka jawab nahi mil sakaa.";
            } catch (err) {
                return "Network error, dobara koshish karein.";
            }
        }

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingRow = document.getElementById('aiLoadingRow');
            const text = input.value.trim();

            if (!text && !attachedImageBase64) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            let userMsgContent = text;
            if (attachedImageBase64) {
                userMsgContent = `<img src="${attachedImageBase64}" style="max-width: 200px; border-radius: 8px; display: block; margin-bottom: 8px;">` + (text || "");
            }

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="msg-bubble">${userMsgContent}</div>`;
            chatContainer.appendChild(userRow);

            input.value = '';
            const currentImg = attachedImageBase64;
            removeAttachedImage();

            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatContainer.appendChild(aiLoadingRow);
            aiLoadingRow.classList.remove('hidden');

            let rawAiResponse = "";
            let finalReply = "";

            if (currentImg) {
                const generatedSVG = await convertImageToLiveStrokeSVG(currentImg);
                if (generatedSVG) {
                    finalReply = `
                        <div class="svg-preview-card">
                            ${generatedSVG}
                        </div>
                        <pre><code class="language-xml">${escapeHtml(generatedSVG)}</code></pre>
                        <p>Aapke image ka <b>Live Stroke SVG</b> vector convert ho gaya hai! Is path ko Adobe Illustrator mein open karke bina expand kiye direct edit kar sakte hain. 😊</p>
                    `;
                } else {
                    rawAiResponse = await callGroqAPI((text || "Image uploaded") + " [User attached an image]");
                    finalReply = marked.parse(rawAiResponse);
                }
            } else {
                let matchedSurahNum = null;
                const lowerText = text.toLowerCase();
                for (let name in surahMap) {
                    if (lowerText.includes(name)) {
                        matchedSurahNum = surahMap[name];
                        break;
                    }
                }

                if (matchedSurahNum && (lowerText.includes("surah") || lowerText.includes("sura") || lowerText.includes("quran"))) {
                    const quranResult = await fetchQuranSurah(matchedSurahNum);
                    if (quranResult.success) {
                        finalReply = quranResult.html;
                    } else {
                        rawAiResponse = await callGroqAPI(text);
                        finalReply = marked.parse(rawAiResponse);
                    }
                } else {
                    rawAiResponse = await callGroqAPI(text);
                    finalReply = marked.parse(rawAiResponse);
                }
            }

            conversationHistory.push({ role: 'user', text: text });
            conversationHistory.push({ role: 'assistant', text: rawAiResponse || "SVG Converted" });

            aiLoadingRow.classList.add('hidden');
            document.body.appendChild(aiLoadingRow);

            const botRow = document.createElement('div');
            botRow.className = 'message-row bot';
            botRow.innerHTML = `
                <div class="ai-avatar-wrapper">
                    <div class="ai-avatar-circle">M&D</div>
                </div>
                <div class="msg-bubble">${finalReply}</div>
            `;
            chatContainer.appendChild(botRow);

            Prism.highlightAll();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
