<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Miswar | AI Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header-box { text-align: center; margin-bottom: 20px; }
        .header-box h1 { color: #38bdf8; margin: 0; font-size: 2.5rem; }
        .header-box p { color: #94a3b8; margin-top: 8px; font-size: 1.1rem; }

        .info-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .info-card h2 { color: #38bdf8; margin-top: 0; }
        .info-card p { color: #cbd5e1; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🚀 Malik Miswar</h1>
        <p>Multilingual Universal AI Assistant</p>
    </div>

    <div class="info-card">
        <h2>Welcome to My Website!</h2>
        <p>Neeche right corner par chat icon par click karein aur mere <strong>AI Assistant</strong> se baat karein!</p>
    </div>

    <script type="text/javascript">
      (function(d, t) {
          var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
          v.onload = function() {
            window.voiceflow.chat.load({
              verify: { projectId: '6a79599ac11516c4e48e1ae1' },
              url: 'https://general-runtime.voiceflow.com',
              voice: {
                url: 'https://runtime-api.voiceflow.com'
              }
            });
          }
          v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>

</body>
</html>
