<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Miswar | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero { text-align: center; padding: 20px; }
        .hero h1 { font-size: 3rem; color: #38bdf8; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; color: #94a3b8; }

        /* Floating Toggle Button */
        .chat-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .chat-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.6);
        }

        /* Floating Widget Window */
        .chat-widget {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 360px;
            height: 520px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0) translateY(100px);
            transform-origin: bottom right;
            opacity: 0;
            z-index: 1000;
        }

        .chat-widget.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Header */
        .chat-header {
            background: #0f172a;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .chat-title h4 { font-size: 0.95rem; color: #38bdf8; }
        .chat-title p { font-size: 0.75rem; color: #4ade80; }
        
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { color: #fff; }

        /* Messages Container */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            max-width: 85%;
        }
        .message-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-wrapper.bot { align-self: flex-start; }

        .message {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .bot-msg {
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        .user-msg {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        /* Speaker Play Button */
        .play-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .play-btn:hover { background: #38bdf8; color: #fff; }
        .play-btn.loading { opacity: 0.5; cursor: wait; color: #f59e0b; }

        /* Input Area */
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            outline: none;
            font-size: 0.9rem;
        }
        .input-btn {
            background: #0284c7;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .input-btn:hover { background: #0369a1; }
        .mic-btn.listening {
            background: #ef4444 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>🚀 Malik Miswar</h1>
        <p>Web Developer & Tech Enthusiast</p>
    </div>

    <button class="chat-toggle-btn" onclick="toggleChat()">
        <i class="fa-solid fa-robot" id="chatIcon"></i>
    </button>

    <div class="chat-widget" id="chatWidget">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="avatar"><i class="fa-solid fa-bot"></i></div>
                <div class="chat-title">
                    <h4>Miswar's Universal AI</h4>
                    <p>● Online</p>
                </div>
            </div>
            <button class="close-btn" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message-wrapper bot">
                <div class="message bot-msg">
                    Hello! 👋 I am Malik Miswar's Professional AI Assistant. How can I help you today? 😊
                </div>
                <button class="play-btn" onclick="speakMsgElevenLabs(this)"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask anything in any language..." onkeypress="handleKeyPress(event)">
            <button class="input-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="input-btn" onclick="sendMessage()" title="Send">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // Groq API Key
        const keyPart1 = "gsk_";
        const keyPart2 = "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";
        const GROQ_API_KEY = keyPart1 + keyPart2;

        // ElevenLabs API Key
        const ELEVENLABS_API_KEY = "sk_50680cbc26fe1b7f53e2eb0bdd04dfb5e7591eae59262974"; 
        let freePremadeVoiceId = null;

        let currentAudio = null;

        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            const icon = document.getElementById('chatIcon');
            widget.classList.toggle('active');

            if (widget.classList.contains('active')) {
                icon.className = 'fa-solid fa-xmark';
            } else {
                icon.className = 'fa-solid fa-robot';
                if (currentAudio) currentAudio.pause();
            }
        }

        // Fetch ONLY free premade voice from ElevenLabs
        async function getFreePremadeVoice() {
            if (freePremadeVoiceId) return freePremadeVoiceId;

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/voices', {
                    headers: { 'xi-api-key': ELEVENLABS_API_KEY }
                });
                const data = await response.json();
                
                if (data.voices) {
                    // Strictly filter voices that belong to category 'premade' (Free Tier Allowed)
                    const premade = data.voices.find(v => v.category === 'premade');
                    if (premade) {
                        freePremadeVoiceId = premade.voice_id;
                        return freePremadeVoiceId;
                    }
                }
            } catch (err) {
                console.error("Voice Fetch Error:", err);
            }
            // Fallback to official default free voice ID (George)
            return "JBFqnCBsd6RMkjVDRZzb"; 
        }

        // ElevenLabs Voice Engine
        async function speakMsgElevenLabs(btnElement) {
            const msgText = btnElement.previousElementSibling.innerText;
            const cleanText = msgText.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();

            if (!cleanText) return;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            btnElement.classList.add('loading');
            btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const activeVoiceId = await getFreePremadeVoice();

                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${activeVoiceId}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'xi-api-key': ELEVENLABS_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: cleanText,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.75
                        }
                    })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    currentAudio = new Audio(audioUrl);
                    currentAudio.play();
                } else {
                    const errorMsg = await response.json();
                    alert("ElevenLabs Error: " + (errorMsg.detail?.message || "Error generating voice."));
                }
            } catch (err) {
                console.error("ElevenLabs Fetch Error:", err);
                alert("Network Connection Error!");
            } finally {
                btnElement.classList.remove('loading');
                btnElement.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        }

        // Voice Input (Mic)
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Browser voice input not supported. Please use Google Chrome!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.interimResults = false;
            const micBtn = document.getElementById('micBtn');

            micBtn.classList.add('listening');
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };

            recognition.onerror = function() { micBtn.classList.remove('listening'); };
            recognition.onend = function() { micBtn.classList.remove('listening'); };
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            const userWrapper = document.createElement('div');
            userWrapper.className = 'message-wrapper user';
            userWrapper.innerHTML = `<div class="message user-msg">${text}</div>`;
            chatBox.appendChild(userWrapper);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const botWrapper = document.createElement('div');
            botWrapper.className = 'message-wrapper bot';
            botWrapper.innerHTML = `<div class="message bot-msg">Thinking... 🧠</div>`;
            chatBox.appendChild(botWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + GROQ_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {
                                role: "system",
                                content: "You are a professional, intelligent, and highly capable AI assistant for Malik Miswar's website. MANDATORY RULE: Always respond in the EXACT SAME LANGUAGE that the user uses to ask the question (e.g., if asked in English respond in English, if asked in Roman Urdu respond in Roman Urdu, if asked in Urdu script respond in Urdu, Spanish, Arabic, French, etc.). CRITICAL RULE: DO NOT start your response with greetings like 'Hello', 'Hi', or 'Assalam-o-Alaikum' in every message unless explicitly greeted first. Give concise, accurate, and professional answers."
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    botWrapper.innerHTML = `
                        <div class="message bot-msg">${reply}</div>
                        <button class="play-btn" onclick="speakMsgElevenLabs(this)" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
                    `;
                } else {
                    botWrapper.innerHTML = `<div class="message bot-msg">I couldn't process that. Could you please repeat? 😊</div>`;
                }
            } catch (error) {
                botWrapper.innerHTML = `<div class="message bot-msg">Network error or API key issue. Please try again! 🙏</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
