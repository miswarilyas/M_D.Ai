<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="GcTCxUjAgdM7zGlZBCGO9RsRFxV-db5bqoDvH-NA09s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&D.Ai - VIP Groq AI Studio by Malik Miswar</title>
    <meta name="description" content="M&D.Ai is your personal premium VIP AI assistant studio powered by Groq Llama 3 & Pollinations.">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23ffd700' d='M379.8 268.7c24.9-19.3 24.9-56 0-75.3-33.7-26.1-98.3-71.8-123.8-89.4-4.2-2.9-9.9-2.9-14.1 0-25.5 17.6-90.1 63.3-123.8 89.4-24.9 19.3-24.9 56 0 75.3 33.7 26.1 98.3 71.8 123.8 89.4 4.2 2.9 9.9 2.9 14.1 0 25.5-17.6 90.1-63.3 123.8-89.4zM256 32l-192 128 192 192 192-192L256 32z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000000; color: #f4f4f5; height: 100vh; display: flex; overflow: hidden; position: relative; }
        .bg-effects { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-glow-ball { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15; animation: floatGlow 12s infinite alternate ease-in-out; }
        .ball-1 { width: 450px; height: 450px; background: #ffffff; top: -10%; left: -10%; }
        .ball-2 { width: 400px; height: 400px; background: #a1a1aa; bottom: -10%; right: -10%; animation-delay: -4s; }
        .ball-3 { width: 300px; height: 300px; background: #ffd700; top: 40%; left: 40%; opacity: 0.08; animation-delay: -8s; }
        @keyframes floatGlow { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 40px) scale(1.2); } 100% { transform: translate(-40px, -50px) scale(0.9); } }
        .sidebar, .main-chat { position: relative; z-index: 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
        .sidebar { width: 280px; background: rgba(12, 12, 15, 0.85); backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-right: 1px solid rgba(255, 255, 255, 0.08); box-shadow: inset -5px 0 15px -5px rgba(255, 215, 0, 0.08); }
        .sidebar-top { display: flex; flex-direction: column; gap: 12px; }
        .new-chat-btn { background: rgba(24, 24, 27, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); color: #ffd700; padding: 12px 18px; border-radius: 24px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s ease; }
        .new-chat-btn:hover { background: #27272a; border-color: #ffd700; box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }
        .clear-all-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .clear-all-btn:hover { background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .recent-section h5 { color: #71717a; font-size: 0.75rem; margin: 12px 0 8px 10px; text-transform: uppercase; letter-spacing: 0.8px; }
        .recent-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; }
        .user-profile-card { background: rgba(24, 24, 27, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #ffd700; color: #09090b; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .user-info { flex: 1; overflow: hidden; }
        .user-info h4 { font-size: 0.88rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info p { font-size: 0.72rem; color: #ffd700; }
        .login-btn { background: #ffd700; color: #09090b; border: none; padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        .login-btn:hover { background: #ffffff; box-shadow: 0 0 15px rgba(255, 215, 0, 0.7); }
        .main-chat { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: transparent; }
        .top-navbar { padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.06); background: rgba(9, 9, 11, 0.6); backdrop-filter: blur(10px); }
        .app-logo { font-size: 1.35rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        .logo-text { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.8); }
        .chat-container { flex: 1; padding: 24px 20%; overflow-y: auto; display: flex; flex-direction: column; gap: 28px; }
        .welcome-screen { text-align: center; margin-top: 14vh; }
        .welcome-screen h1 { font-size: 2.8rem; color: #ffffff; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.8px; }
        .welcome-screen h1 span { color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        .welcome-screen p { color: #a1a1aa; font-size: 1.05rem; }
        .message-row { display: flex; gap: 16px; width: 100%; animation: fadeIn 0.3s ease-in-out; }
        .message-row.user { justify-content: flex-end; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg-bubble { max-width: 85%; padding: 14px 20px; border-radius: 18px; font-size: 0.98rem; line-height: 1.65; }
        .user .msg-bubble { background: rgba(24, 24, 27, 0.9); color: #f4f4f5; border: 1px solid rgba(255, 255, 255, 0.1); border-bottom-right-radius: 4px; }
        .bot .msg-bubble { background: transparent; color: #e4e4e7; padding: 0; flex: 1; }
        .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 14px 0 8px; color: #ffd700; font-weight: 600; }
        .msg-bubble p { margin-bottom: 10px; }
        .msg-bubble ul, .msg-bubble ol { margin: 10px 0 10px 20px; }
        .msg-bubble li { margin-bottom: 6px; }
        .msg-bubble pre { background: rgba(18, 18, 21, 0.9); padding: 16px; border-radius: 12px; overflow-x: auto; border: 1px solid rgba(255, 255, 255, 0.1); margin: 12px 0; }
        .msg-bubble code { font-family: monospace; color: #ffd700; background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px; font-size: 0.88rem; }
        .msg-bubble img { max-width: 100%; width: 500px; border-radius: 16px; margin-top: 12px; border: 1px solid rgba(255, 215, 0, 0.5); box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: block; }
        .input-container-wrapper { padding: 20px 20% 32px; background: rgba(9, 9, 11, 0.4); backdrop-filter: blur(10px); }
        .input-bar { background: rgba(18, 18, 21, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; display: flex; align-items: center; padding: 8px 18px; gap: 10px; transition: all 0.2s; }
        .input-bar:focus-within { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .input-bar input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 0.98rem; padding: 8px; }
        .icon-btn { background: transparent; border: none; color: #71717a; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.1rem; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffd700; }
        .mic-btn.listening { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        .ai-avatar-circle { width: 34px; height: 34px; border-radius: 50%; background: #09090b; border: 2px solid #ffd700; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.72rem; color: #ffd700; flex-shrink: 0; letter-spacing: -0.5px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
        .ai-avatar-circle.thinking { animation: goldGlowPulse 1.4s infinite ease-in-out; }
        @keyframes goldGlowPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-effects">
        <div class="bg-glow-ball ball-1"></div>
        <div class="bg-glow-ball ball-2"></div>
        <div class="bg-glow-ball ball-3"></div>
    </div>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New VIP Chat
            </button>
            <button class="clear-all-btn" onclick="clearAllChatHistory()">
                <i class="fa-solid fa-trash-can"></i> Clear All History
            </button>
            <div class="recent-section">
                <h5>Recent VIP Chats</h5>
                <ul class="recent-list" id="recentList"></ul>
            </div>
        </div>

        <div class="user-profile-card">
            <div class="user-profile">
                <div class="user-avatar" id="avatarText">MM</div>
                <div class="user-info">
                    <h4 id="userName">Malik Miswar</h4>
                    <p id="userStatus">● VIP Active</p>
                </div>
            </div>
            <button class="login-btn" onclick="handleAccountLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Switch VIP Account
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="top-navbar">
            <div class="app-logo">
                <i class="fa-solid fa-bolt" style="color: #ffd700;"></i>
                <span class="logo-text">M&D.Ai <small style="color: #ffd700; font-size: 0.6rem; font-weight: 600;">Groq Superfast</small></span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 id="welcomeTitle">✨ Hello, <span>Malik Miswar</span></h1>
                <p>How can I help you today? Ask anything or type 'wallpaper bna do' 🎨</p>
            </div>
        </div>

        <div id="aiLoadingRow" class="hidden message-row bot">
            <div class="ai-avatar-circle thinking">M&D</div>
        </div>

        <div class="input-container-wrapper">
            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Ask M&D.Ai, or type 'wallpaper bna do'..." onkeypress="handleKeyPress(event)">
                
                <button class="icon-btn mic-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="icon-btn" onclick="sendMessage()" title="Send Premium">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        
        const SYSTEM_PROMPT = `
You are 'M&D.Ai VIP', an ultra-smart AI assistant created by Malik Miswar running on Groq.

CRITICAL TONE & LANGUAGE INSTRUCTIONS:
1. STRICT SINGLE LANGUAGE: Respond strictly in the exact language/script of the user's message.
   - If user types in Roman Urdu (e.g., "kaise ho", "kya chal raha hai"), respond ONLY in Roman Urdu.
   - If user types in English, respond ONLY in English.
   - NEVER add English translations or brackets like "(How are you?)".

2. GREETINGS & SALAM RULE:
   - DO NOT start responses with automatic Salam or Greetings if the user asks a direct question.
   - ONLY say "Wa Alaikum Assalam" if the user explicitly says "Salam" or "Assalam-o-Alaikum" first.
   - If user says "Hi", "Hello", or "Hii", respond with friendly Gemini-style greeting and emojis (e.g. "Hello! ✨ Main bilkul theek hoon, aap bataayein? 😊").

3. GEMINI EMOJI TONE: Keep the style ultra-clean, smart, and helpful using emojis (✨, 🚀, 💡, 🎨, 🤖) like Google Gemini.
`;
        let conversationHistory = [];

        window.onload = function() {
            const savedHistory = localStorage.getItem('md_ai_chat_history');
            if (savedHistory) {
                try {
                    conversationHistory = JSON.parse(savedHistory) || [];
                    const chatContainer = document.getElementById('chatContainer');
                    const welcome = document.getElementById('welcomeScreen');
                    if (welcome && conversationHistory.length > 0) welcome.remove();

                    for (let msg of conversationHistory) {
                        const row = document.createElement('div');
                        if (msg.role === 'user') {
                            row.className = 'message-row user';
                            row.innerHTML = `<div class="msg-bubble">${msg.text}</div>`;
                        } else {
                            row.className = 'message-row bot';
                            row.innerHTML = `<div class="ai-avatar-circle">M&D</div><div class="msg-bubble">${marked.parse(msg.text)}</div>`;
                        }
                        chatContainer.appendChild(row);
                    }
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch(e) {}
            }
        };

        function saveToLocalStorage() {
            localStorage.setItem('md_ai_chat_history', JSON.stringify(conversationHistory));
        }

        function handleAccountLogin() {
            const name = prompt("Enter Name:", "Malik Miswar");
            if (name && name.trim()) {
                document.getElementById('userName').innerText = name.trim();
                document.getElementById('avatarText').innerText = name.trim().substring(0, 2).toUpperCase();
            }
        }

        function startNewChat() {
            localStorage.removeItem('md_ai_chat_history');
            conversationHistory = [];
            location.reload();
        }

        function clearAllChatHistory() { if (confirm("Delete all history?")) startNewChat(); }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Use Chrome browser.");
            const recognition = new SpeechRecognition();
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');
            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                sendMessage();
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        }

        async function callGroqAPI(userText) {
            try {
                let messagesPayload = [{ role: "system", content: SYSTEM_PROMPT }];
                
                const recentHistory = conversationHistory.slice(-6);
                for (let h of recentHistory) {
                    messagesPayload.push({
                        role: h.role === 'user' ? 'user' : 'assistant',
                        content: h.text
                    });
                }
                messagesPayload.push({ role: "user", content: userText });

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messagesPayload
                    })
                });

                const data = await response.json();

                if (data.error) {
                    return `**Groq API Error:** ${data.error.message || "Something went wrong"}`;
                }

                if (data.choices && data.choices[0]?.message?.content) {
                    return data.choices[0].message.content.trim();
                }
                return "Jawab nahi mil sakaa. Dubara try karein.";
            } catch (err) {
                return "Network Error! Connection check karein.";
            }
        }

        async function renderFluxImage(promptText) {
            const seed = Math.floor(Math.random() * 9999999);
            const cleanPrompt = encodeURIComponent(`${promptText}, 8k resolution, photorealistic, ultra detailed`);
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=1280&height=1280&seed=${seed}&model=flux&nologo=true&enhance=true`;
            return `Here is your requested image ✨:\n\n![Generated Image](${imageUrl})`;
        }

        function checkIsImageRequest(str) {
            const keywords = ['/image', 'generate image', 'create image', 'draw', 'wallpaper', 'bna do', 'photo', 'pic', 'tasveer', 'image of'];
            return keywords.some(k => str.toLowerCase().includes(k));
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const aiLoadingRow = document.getElementById('aiLoadingRow');
            const text = input.value.trim();

            if (!text) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatContainer.appendChild(userRow);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatContainer.appendChild(aiLoadingRow);
            aiLoadingRow.classList.remove('hidden');

            try {
                let rawReply = "";
                const isImageReq = checkIsImageRequest(text);

                if (isImageReq) {
                    rawReply = await renderFluxImage(text);
                } else {
                    rawReply = await callGroqAPI(text);
                }

                conversationHistory.push({ role: 'user', text: text });
                conversationHistory.push({ role: 'assistant', text: rawReply });

                aiLoadingRow.classList.add('hidden');
                document.body.appendChild(aiLoadingRow);

                const botRow = document.createElement('div');
                botRow.className = 'message-row bot';
                botRow.innerHTML = `<div class="ai-avatar-circle">M&D</div><div class="msg-bubble">${marked.parse(rawReply)}</div>`;
                chatContainer.appendChild(botRow);

                saveToLocalStorage();
            } catch (err) {
                aiLoadingRow.classList.add('hidden');
                document.body.appendChild(aiLoadingRow);
                const errorRow = document.createElement('div');
                errorRow.className = 'message-row bot';
                errorRow.innerHTML = `<div class="ai-avatar-circle">M&D</div><div class="msg-bubble">Error: ${err.message}</div>`;
                chatContainer.appendChild(errorRow);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
