<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Miswar | AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-box { text-align: center; margin-bottom: 20px; }
        .header-box h1 { color: #38bdf8; font-size: 2.2rem; }
        .header-box p { color: #94a3b8; margin-top: 5px; }

        .chat-card {
            width: 100%;
            max-width: 450px;
            height: 550px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0f172a;
            padding: 15px;
            border-bottom: 1px solid #334155;
            text-align: center;
            font-weight: bold;
            color: #38bdf8;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .bot-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            background: #0284c7;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            outline: none;
        }

        .chat-input-area button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🚀 Malik Miswar</h1>
        <p>Smart Portfolio & Assistant</p>
    </div>

    <div class="chat-card">
        <div class="chat-header">🤖 Miswar's Assistant</div>
        <div class="chat-messages" id="chatBox">
            <div class="message bot-msg">Hello! Main Malik Miswar ka assistant hoon. Aap mujh se unke baaray mein kuch bhi pooch saktay hain!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask something (e.g. hello, contact, skills)..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Display User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Generate Smart Response
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                botDiv.innerText = getBotResponse(text.toLowerCase());
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function getBotResponse(input) {
            if (input.includes('hello') || input.includes('hi') || input.includes('hey') || input.includes('kia hal')) {
                return "Walaikum Assalam! Kaisay hain aap? Main aapki kya madad kar sakta hoon?";
            } else if (input.includes('who') || input.includes('kon') || input.includes('miswar')) {
                return "Malik Miswar ek passionate Web Developer aur Tech Enthusiast hain!";
            } else if (input.includes('contact') || input.includes('email') || input.includes('number')) {
                return "Aap Malik Miswar se unke social links ya direct website ke zariye rabta kar sakte hain!";
            } else if (input.includes('skill') || input.includes('work') || input.includes('project')) {
                return "Malik Miswar Web Development, HTML/CSS/JS, aur AI Integration par kaam karte hain.";
            } else {
                return "Shukriya aapke message ka! Main ne aapka paigham note kar liya hai.";
            }
        }
    </script>

</body>
</html>
