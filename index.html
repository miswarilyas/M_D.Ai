<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miswar's Official Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
        h3 { color: #94a3b8; font-weight: 400; margin-top: 0; }
        p { color: #cbd5e1; font-size: 1rem; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Malik Miswar</h1>
        <h3>Web Developer & Creator</h3>
        <p>Welcome to my updated website hosted live using Linux Chromebook, Git & Vercel!</p>
        <a href="https://github.com/miswarilyas" class="btn" target="_blank">Visit My GitHub</a>
    </div>
</body>
</html>
