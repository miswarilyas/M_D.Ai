<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malik Miswar - AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-card {
      width: 400px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      height: 550px;
    }
    .chat-header {
      background: #0f172a;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #334155;
    }
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    .bot {
      background: #334155;
      align-self: flex-start;
      color: #e2e8f0;
    }
    .user {
      background: #0284c7;
      align-self: flex-end;
      color: #fff;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      outline: none;
    }
    .chat-input button {
      margin-left: 8px;
      padding: 10px 16px;
      background: #0284c7;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .chat-input button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="chat-header">🤖 Miswar's Universal Assistant</div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">
      Hello! Main Malik Miswar ka Smart AI Assistant hoon. Aap Malik Miswar ke bare me ya duniya ki kisi bhi cheez ke bare me mujh se poochange, main jawab doonga!
    </div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Kuch bhi poochein..." onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Tumhari API Key yahan lage gi (OpenAI ya OpenRouter)
  const API_KEY = "YOUR_OPENAI_OR_OPENROUTER_API_KEY";

  async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const userText = inputField.value.trim();

    if (!userText) return;

    // User message show karo
    chatBox.innerHTML += `<div class="message user">${userText}</div>`;
    inputField.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Loading indicator
    const loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `<div class="message bot" id="${loadingId}">Soch raha hoon...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [
            {
              role: "system",
              content: "You are an intelligent, friendly AI assistant created by Malik Miswar (a Web Developer and Tech Enthusiast). You can answer questions about Malik Miswar as well as general knowledge, history, science, world affairs, and any topic the user asks in Roman Urdu or English."
            },
            {
              role: "user",
              content: userText
            }
          ]
        })
      });

      const data = await response.json();
      const botReply = data.choices[0].message.content;

      // Replace loading message with actual response
      document.getElementById(loadingId).innerText = botReply;
      chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
      document.getElementById(loadingId).innerText = "Aapke sawal ka jawab dene me masla aya, barah-e-karam dobara koshish karein.";
      console.error(error);
    }
  }
</script>

</body>
</html>
