<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Miswar | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero {
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #94a3b8;
        }

        /* Floating Toggle Button */
        .chat-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .chat-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.6);
        }

        /* Floating Widget Window */
        .chat-widget {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 360px;
            height: 520px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0) translateY(100px);
            transform-origin: bottom right;
            opacity: 0;
            z-index: 1000;
        }

        .chat-widget.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Header */
        .chat-header {
            background: #0f172a;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .chat-title h4 {
            font-size: 0.95rem;
            color: #38bdf8;
        }
        .chat-title p {
            font-size: 0.75rem;
            color: #4ade80;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover { color: #38bdf8; }
        .action-btn.muted { color: #ef4444; }

        /* Messages Container */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .bot-msg {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .user-msg {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Input Area */
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-area button {
            background: #0284c7;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .chat-input-area button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>🚀 Malik Miswar</h1>
        <p>Web Developer & Tech Enthusiast</p>
    </div>

    <button class="chat-toggle-btn" onclick="toggleChat()">
        <i class="fa-solid fa-robot" id="chatIcon"></i>
    </button>

    <div class="chat-widget" id="chatWidget">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="avatar"><i class="fa-solid fa-bot"></i></div>
                <div class="chat-title">
                    <h4>Miswar's Universal AI</h4>
                    <p>● Online</p>
                </div>
            </div>
            <div class="header-controls">
                <button class="action-btn" id="voiceToggle" onclick="toggleVoice()" title="Toggle Voice Output">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button class="action-btn" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message bot-msg">
                Hey there! 👋 Main Malik Miswar ka AI Assistant hoon. Main aapki kya help karoon? 😊
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Kuch bhi poochein..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // Key split logic
        const keyPart1 = "gsk_";
        const keyPart2 = "3bIzaPJgYJtT485fD70BWGdyb3FYRbrY7s3WDoB3iDaErKwq10ci";
        const GROQ_API_KEY = keyPart1 + keyPart2;

        let voiceEnabled = true;

        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            const icon = document.getElementById('chatIcon');
            widget.classList.toggle('active');

            if (widget.classList.contains('active')) {
                icon.className = 'fa-solid fa-xmark';
            } else {
                icon.className = 'fa-solid fa-robot';
                window.speechSynthesis.cancel(); // Stop speech if chat closed
            }
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggle');
            if (voiceEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btn.classList.remove('muted');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btn.classList.add('muted');
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Stop previous audio

            // Clean text (remove emojis & special chars for smooth voice)
            const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Render User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Render Loading Message
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-msg';
            botDiv.innerText = 'Soch raha hoon... 🧠';
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + GROQ_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {
                                role: "system",
                                content: "You are a friendly, smart AI assistant for Malik Miswar's website. Talk in Roman Urdu or English depending on the user. CRITICAL RULE: DO NOT start your response with greetings like 'Assalam-o-Alaikum', 'Hello', or 'Hi' in every message unless the user explicitly greets you first. Direct answer the question in a friendly, conversational, and natural tone with relevant emojis."
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    botDiv.innerText = reply;
                    speakText(reply); // Voice Output Trigger
                } else {
                    botDiv.innerText = "Arey, mujhe samajh nahi aaya! Ek baar phir se poochenge? 😊";
                }
            } catch (error) {
                botDiv.innerText = "Network issue ya API key check kar lein! 🙏";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
